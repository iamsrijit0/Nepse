#  .github/workflows/fundamental_screener.yml
#  Place this file inside iamsrijit0/Nepse repository at:
#  .github/workflows/fundamental_screener.yml
# ============================================================

name: NEPSE Fundamental Screener & Filter

on:
  # Run every Saturday at 08:15 Nepal time (02:30 UTC — Nepal is UTC+5:45)
  schedule:
    - cron: "30 02 * * 6"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  screen-and-filter:
    name: Run Screener + 5-Layer Filter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout this repo (iamsrijit0/Nepse) ──────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      # ── 4. Run fundamental screener → Fundamental_Screener_YYYY-MM-DD.csv ─
      #    Uploads top-50 scored stocks to Claude Fundamentals/
      - name: Run NEPSE Fundamental Screener
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python nepse_fundamental_screener.py

      # ── 5. Run 5-layer filter → Filter_YYYY-MM-DD.csv ─────────────────────
      #    Applies score gate → P/E cap → ROA floor → sector cap → base-effect
      #    check, then uploads top-15 surviving picks to Claude Fundamentals/
      - name: Run NEPSE 5-Layer Filter
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python nepse_filter_screener.py
