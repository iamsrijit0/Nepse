name: NEPSE Fundamental Screener

on:
  # Run every Saturday at 08:15 Nepal time (02:30 UTC — Nepal is UTC+5:45)
  schedule:
    - cron: "30 02 * * 6"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  screen:
    name: Run Fundamental Screener
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout this repo (iamsrijit0/Nepse) ──────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      # ── 4. Run screener ───────────────────────────────────────────────────
      #    GH_TOKEN is passed as an env variable (set in repo Settings → Secrets)
      #    It needs:  Contents: Read & Write  on iamsrijit0/Nepse
      - name: Run NEPSE Fundamental Screener
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python nepse_fundamental_screener.py
